<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <link
    rel="stylesheet"
    type="text/css"
    href="style.css"
  >

  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.min.js"></script>

  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>

  <title>Rock Paper Scissors</title>

</head>

<body>

  <!-- GAME INFORMATION -->
  <div id="gameInfo">

    <h1></h1>

    <div class="playerInputs">

      <div class="inputBox">

        <label for="player1Name">
          Player 1 Name
        </label>

        <input
          type="text"
          id="player1Name"
          placeholder="Player 1"
        >

      </div>


      <div class="inputBox">

        <label for="player2Name">
          Player 2 Name
        </label>

        <input
          type="text"
          id="player2Name"
          placeholder="Player 2"
        >

      </div>

    </div>


    <div class="betBox">

      <label for="betInput">
        What's on the line?
      </label>

      <input
        type="text"
        id="betInput"
        placeholder="Loser buys dinner..."
      >

      <p>Or nothing, just for fun!</p>

    </div>

  </div>


  <!-- P5 CANVAS -->
  <main></main>


  <script src="sketch.js"></script>

</body>

</html>
