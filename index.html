
<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Rock Paper Scissors</title>

  <!-- CSS -->
  <link
    rel="stylesheet"
    type="text/css"
    href="style.css"
  >

  <!-- P5.JS -->
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.min.js"></script>

  <!-- P5 SOUND -->
  <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.min.js"></script>

  <!-- ML5 HANDPOSE -->
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>

</head>

<body>

  <!-- GAME INFORMATION -->

  <div id="gameInfo">

    <div class="playerInputs">

      <div class="inputBox">

        <label for="player1Name">
          Player 1 Name
        </label>

        <input
          type="text"
          id="player1Name"
          placeholder="Player 1"
        >

      </div>

      <div class="inputBox">

        <label for="player2Name">
          Player 2 Name
        </label>

        <input
          type="text"
          id="player2Name"
          placeholder="Player 2"
        >

      </div>

    </div>

    <!-- BET SECTION -->

    <div class="betBox">

      <label for="betInput">
        What's on the line?
      </label>

      <input
        type="text"
        id="betInput"
        placeholder="Loser buys dinner..."
      >

      <p>Or nothing, just for fun!</p>

    </div>

  </div>

  <!-- GAME CANVAS -->

  <main></main>

  <!-- AUDIO STATUS -->
  <div id="audioStatus" style="
    text-align: center;
    font-family: monospace;
    font-size: 12px;
    color: #18c9d1;
    margin-bottom: 20px;
  ">
    Checking audio...
  </div>

  <!-- GAME JAVASCRIPT -->

  <script src="sketch.js"></script>

  <script>
    window.addEventListener("load", function() {

      const status =
        document.getElementById("audioStatus");

      if (typeof loadSound === "function") {

        status.textContent =
          "Sound library loaded";

        console.log("P5 SOUND LIBRARY LOADED");

      } else {

        status.textContent =
          "Sound library failed to load";

        console.error(
          "P5 SOUND LIBRARY NOT FOUND"
        );
      }

    });
  </script>

</body>

</html>
